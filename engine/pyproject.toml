[project]
name = "breakpoint-debug"
version = "0.1.0"
description = "Evidence-first debugging engine for order-dependent and flaky tests. FastAPI service + CLI."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "../LICENSE" }
authors = [{ name = "Breakpoint" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "typer>=0.12",
]

[project.optional-dependencies]
ai = ["openai>=1.40"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
breakpoint = "breakpoint.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["breakpoint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
